name: PR86 Principal Fix 2

on:
  push:
    branches:
      - glm/ant-275-physical-fixes

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source changes
        run: python scripts/pr86_principal_fix.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q config core scripts tests main.py
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "Principal Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Principal blockers on PR #86"
          git push origin HEAD:glm/ant-275-physical-fixes
