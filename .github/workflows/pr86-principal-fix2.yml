name: PR86 Principal Fix 2

on:
  push:
    branches:
      - glm/ant-275-physical-fixes

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make voice-runtime marker newline-agnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr86_principal_fix.py')
          s = p.read_text(encoding='utf-8')
          old = '''if marker not in voice:\n    raise SystemExit("BargeInSettings marker not found")\nvoice = voice.split(marker, 1)[0].rstrip() + "\\n"\nwrite_raw(voice_path, voice)'''
          new = '''voice_nl = voice.replace("\\r\\n", "\\n")\nif marker not in voice_nl:\n    raise SystemExit("BargeInSettings marker not found")\nvoice_nl = voice_nl.split(marker, 1)[0].rstrip() + "\\n"\nvoice = voice_nl.replace("\\n", "\\r\\n") if "\\r\\n" in voice else voice_nl\nwrite_raw(voice_path, voice)'''
          if old not in s:
              raise SystemExit('temporary fixer marker block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply reviewed source changes
        run: python scripts/pr86_principal_fix.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q config core scripts tests main.py
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name "Principal Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Principal blockers on PR #86"
          git push origin HEAD:glm/ant-275-physical-fixes
