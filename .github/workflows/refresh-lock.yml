name: Refresh Antonella lock

on:
  push:
    branches:
      - codex/ant-010-stabilization

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/ant-010-stabilization

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"

      - name: Refresh lock and export
        run: |
          uv lock
          uv export --locked --no-dev --no-emit-project --output-file requirements.txt

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- uv.lock requirements.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          git commit -m "chore: refresh typed settings lock"
          git push origin HEAD:codex/ant-010-stabilization
