name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dependency-lock:
    name: Dependency lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify pip compatibility export
        run: |
          uv export --locked --no-dev --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt

  baseline:
    name: Python ${{ matrix.python-version }} baseline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install settings test dependency
        run: python -m pip install --disable-pip-version-check "pydantic-settings==2.15.0"

      - name: Compile Python sources
        run: python -m compileall -q actions core dashboard memory plugins main.py ui.py setup.py

      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
