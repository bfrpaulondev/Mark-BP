name: Finalize ANT-013 roadmap

on:
  push:
    branches:
      - codex/ant-010-stabilization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/ant-010-stabilization

      - name: Mark ANT-013 complete
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/ANTONELLA_MASTER_ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "- [ ] **ANT-013 — Criar configuração tipada.** Substituir leituras dispersas de JSON por Pydantic Settings e variáveis de ambiente."
          new = "- [x] **ANT-013 — Criar configuração tipada.** Substituir leituras dispersas de JSON por Pydantic Settings e variáveis de ambiente. Evidência: [`config/settings.py`](../config/settings.py), [`tests/test_typed_settings.py`](../tests/test_typed_settings.py) e [estado da execução](ANTONELLA_PROGRESS.md)."
          if text.count(old) != 1:
              raise SystemExit("ANT-013 roadmap entry was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/finalize-ant013-docs.yml").unlink()

      - name: Commit final documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ANTONELLA_MASTER_ROADMAP.md .github/workflows/finalize-ant013-docs.yml
          git commit -m "docs: mark ANT-013 complete"
          git push origin HEAD:codex/ant-010-stabilization
